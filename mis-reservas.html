<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pádel Reservas - Mis reservas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="encabezado" class="encabezado"></header>

  <main class="contenedor">
    <section class="tarjeta">
      <h1>Mis reservas</h1>
      <p class="mensaje aviso">El saldo tiene que estar pagado antes de usar la cancha. Si cancelás, no hay devolución de lo abonado.</p>
      <p id="mensaje" class="mensaje" hidden></p>

      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Club</th><th>Cancha</th><th>Fecha</th><th>Hora</th>
              <th>Precio</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-reservas"></tbody>
        </table>
      </div>
      <p id="sin-reservas" class="ayuda" hidden>Todavía no tenés reservas. <a href="reservar.html">Reservá un turno</a>.</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mis-reservas.js"></script>
</body>
</html>
